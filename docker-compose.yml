# Nucleo IA - laboratorio local.
# Ollama corre en el HOST (no en Docker) para aprovechar RAM/GPU sin capas extra.
services:
  nucleo-ia:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: nucleo-ia
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./${CONFIG_FILE:-config.yaml}:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    # Red del host: asi alcanza al Ollama que escucha en 127.0.0.1:11434.
    network_mode: host
    restart: unless-stopped

  chat:
    image: ghcr.io/open-webui/open-webui:main
    container_name: nucleo-chat
    environment:
      # El chat guarda la conversacion y la reenvia completa: por eso se puede
      # cambiar de modelo a mitad de charla sin perder el contexto.
      OPENAI_API_BASE_URL: http://host.docker.internal:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      ENABLE_OLLAMA_API: "false"
      WEBUI_AUTH: "false"
      # Sin estas, Open WebUI lanza llamadas extra por cada mensaje (titulo,
      # etiquetas, sugerencias) que en CPU saturan la maquina y todo se traba.
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
    volumes:
      - webui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:8080"
    depends_on: [nucleo-ia]
    restart: unless-stopped

volumes:
  webui:
