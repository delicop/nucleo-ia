# Nucleo IA - laboratorio local.
# Ollama corre en el HOST (no en Docker) para aprovechar RAM/GPU sin capas extra.
services:
  nucleo-ia:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: nucleo-ia
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./${CONFIG_FILE:-config.yaml}:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    # Red del host: asi alcanza al Ollama que escucha en 127.0.0.1:11434.
    network_mode: host
    restart: unless-stopped

# El chat de pruebas es chat/index.html, servido aparte (ver arrancar.sh).
# Open WebUI se probo y se quito: ver "Por que no Open WebUI" en CONTEXTO.md.
