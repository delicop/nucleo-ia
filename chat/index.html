<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Núcleo IA</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --texto:#e7e9ee; --suave:#9aa3b2; --acento:#22c55e; --borde:#262b36; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--texto);
         font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--borde); flex-wrap:wrap; }
  header b { font-weight:600; }
  select, button { background:var(--panel); color:var(--texto); border:1px solid var(--borde); border-radius:8px; padding:8px 12px; font-size:14px; }
  button { cursor:pointer; }
  button:hover { border-color:var(--acento); }
  #estado { color:var(--suave); font-size:13px; margin-left:auto; }
  #hilo { flex:1; overflow-y:auto; padding:20px 16px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:760px; width:100%; margin:0 auto; display:flex; gap:10px; }
  .quien { color:var(--suave); font-size:12px; min-width:80px; padding-top:3px; }
  .texto { white-space:pre-wrap; flex:1; }
  .yo .texto { background:var(--panel); border:1px solid var(--borde); border-radius:10px; padding:10px 12px; }
  .meta { color:var(--suave); font-size:12px; margin-top:4px; }
  form { display:flex; gap:10px; padding:14px 16px; border-top:1px solid var(--borde); }
  textarea { flex:1; resize:none; background:var(--panel); color:var(--texto); border:1px solid var(--borde);
             border-radius:10px; padding:10px 12px; font:inherit; min-height:48px; max-height:180px; }
  .aviso { color:var(--suave); font-size:13px; text-align:center; padding:8px; }
</style>
</head>
<body>
<header>
  <b>Núcleo IA</b>
  <select id="modelo"></select>
  <button id="limpiar" type="button">Nueva conversación</button>
  <label class="aviso"><input type="checkbox" id="adjunto-lbl" hidden></label>
  <input type="file" id="foto" accept="image/*" style="max-width:190px">
  <span id="estado">conectando…</span>
</header>

<div id="hilo"></div>
<div class="aviso">El historial se envía completo en cada pregunta: puedes cambiar de modelo a mitad de la charla sin perder el contexto.</div>

<form id="envio">
  <textarea id="entrada" placeholder="Escribe aquí… (Enter envía, Shift+Enter salta de línea)"></textarea>
  <button type="submit">Enviar</button>
</form>

<script>
const API = location.origin.replace(/:\d+$/, '') + ':4000';
const CLAVE = new URLSearchParams(location.search).get('key') || localStorage.getItem('nucleo_key') || '';
if (CLAVE) localStorage.setItem('nucleo_key', CLAVE);

const $ = s => document.querySelector(s);
const hilo = $('#hilo'), estado = $('#estado'), selModelo = $('#modelo');
let mensajes = [];   // el contexto vive aqui: se manda completo cada vez

function pinta(quien, texto, meta) {
  const d = document.createElement('div');
  d.className = 'msg' + (quien === 'Tú' ? ' yo' : '');
  d.innerHTML = `<div class="quien">${quien}</div><div><div class="texto"></div>${meta ? `<div class="meta">${meta}</div>` : ''}</div>`;
  d.querySelector('.texto').textContent = texto;
  hilo.appendChild(d); hilo.scrollTop = hilo.scrollHeight;
  return d.querySelector('.texto');
}

async function cargarModelos() {
  try {
    const r = await fetch(API + '/v1/models', { headers: { Authorization: 'Bearer ' + CLAVE } });
    const d = await r.json();
    selModelo.innerHTML = d.data.map(m => `<option>${m.id}</option>`).join('');
    estado.textContent = d.data.length + ' modelos · ' + API;
  } catch (e) { estado.textContent = 'sin conexión con ' + API; }
}

async function preguntar(texto, imagenDataUrl) {
  const contenido = imagenDataUrl
    ? [{ type: 'text', text: texto || 'Describe en español qué ves.' }, { type: 'image_url', image_url: { url: imagenDataUrl } }]
    : texto;
  mensajes.push({ role: 'user', content: contenido });
  pinta('Tú', texto + (imagenDataUrl ? ' [con foto]' : ''));

  const modelo = selModelo.value;
  const salida = pinta(modelo, '', 'pensando…');
  const t0 = performance.now();

  try {
    const r = await fetch(API + '/v1/chat/completions', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + CLAVE, 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: modelo, messages: mensajes, stream: true })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status + ' — ' + (await r.text()).slice(0, 200));

    const lector = r.body.getReader(), dec = new TextDecoder();
    let buffer = '', completo = '';
    while (true) {
      const { done, value } = await lector.read();
      if (done) break;
      buffer += dec.decode(value, { stream: true });
      const lineas = buffer.split('\n'); buffer = lineas.pop();
      for (const l of lineas) {
        if (!l.startsWith('data: ') || l.includes('[DONE]')) continue;
        try {
          const trozo = JSON.parse(l.slice(6)).choices?.[0]?.delta?.content;
          if (trozo) { completo += trozo; salida.textContent = completo; hilo.scrollTop = hilo.scrollHeight; }
        } catch {}
      }
    }
    mensajes.push({ role: 'assistant', content: completo });
    salida.parentElement.querySelector('.meta').textContent =
      modelo + ' · ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s';
  } catch (e) {
    salida.textContent = 'Error: ' + e.message;
    salida.parentElement.querySelector('.meta').textContent = '';
    mensajes.pop();
  }
}

$('#envio').addEventListener('submit', async ev => {
  ev.preventDefault();
  const texto = $('#entrada').value.trim();
  const archivo = $('#foto').files[0];
  if (!texto && !archivo) return;
  $('#entrada').value = '';
  let dataUrl = null;
  if (archivo) {
    dataUrl = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(archivo); });
    $('#foto').value = '';
  }
  preguntar(texto, dataUrl);
});

$('#entrada').addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); $('#envio').requestSubmit(); }
});

$('#limpiar').addEventListener('click', () => { mensajes = []; hilo.innerHTML = ''; });

cargarModelos();
</script>
</body>
</html>
